<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비룡초 청소당번</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #fff5f7;
            --card: #ffffff;
            --accent: #ff85a2;
            --accent2: #ffb7c5;
            --secondary: #a0e7e5;
            --yellow: #ffe066;
            --green: #a8e6cf;
            --text: #4a4a4a;
            --muted: #9b9b9b;
            --border: #fce4ec;
            --selected-bg: #fff0f3;
            --selected-border: #ff85a2;
            --shadow: 0 10px 25px rgba(255, 133, 162, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 60px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 183, 197, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(160, 231, 229, 0.15) 0%, transparent 40%);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '🌸';
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            opacity: 0.3;
        }

        body::after {
            content: '✨';
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 2rem;
            opacity: 0.3;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        header h1 {
            font-family: 'Jua', sans-serif;
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            letter-spacing: -1px;
            color: var(--accent);
            text-shadow: 3px 3px 0px rgba(255, 183, 197, 0.3);
            margin-bottom: 8px;
        }

        header p {
            color: var(--muted);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
            border: 2px solid white;
            box-shadow: var(--shadow);
        }

        .grid-label {
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .student-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .student-card:hover:not(.excluded) {
            border-color: var(--accent2);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 20px rgba(255, 133, 162, 0.15);
        }

        .student-card .num {
            font-size: 0.75rem;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .student-card .name {
            font-family: 'Jua', sans-serif;
            font-size: 1.05rem;
            color: var(--text);
        }

        .student-card.excluded {
            background: #f5f5f5;
            border-color: #eeeeee;
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .student-card.selected {
            background: var(--selected-bg);
            border-color: var(--selected-border);
            box-shadow: 0 0 20px rgba(255, 133, 162, 0.25);
            animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .student-card.selected .name {
            color: var(--accent);
        }

        .student-card.rolling {
            animation: shake 0.15s infinite alternate;
            border-color: var(--yellow);
            background: #fffdf0;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            from { transform: rotate(-4deg) scale(1.1); }
            to { transform: rotate(4deg) scale(1.1); }
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .controls label {
            font-family: 'Jua', sans-serif;
            color: var(--text);
            font-size: 1rem;
        }

        .controls input[type="number"] {
            width: 70px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--accent);
            font-size: 1.1rem;
            font-family: 'Jua', sans-serif;
            padding: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .controls input[type="number"]:focus {
            border-color: var(--accent);
        }

        .hint {
            font-size: 0.85rem;
            color: var(--muted);
            margin-left: auto;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            margin-bottom: 36px;
        }

        .btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            border: none;
            border-radius: 20px;
            padding: 15px 30px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            flex: 2;
            box-shadow: 0 8px 15px rgba(255, 133, 162, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(255, 133, 162, 0.4);
            filter: brightness(1.05);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-primary:disabled {
            background: #e0e0e0;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: white;
            color: var(--muted);
            border: 2px solid var(--border);
            flex: 1;
        }

        .btn-reset:hover {
            background: #fafafa;
            color: var(--text);
            border-color: var(--muted);
        }

        .result-section {
            background: white;
            border: 3px solid var(--accent2);
            border-radius: 25px;
            padding: 30px;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        .result-section::before {
            content: '🎉';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5rem;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .result-section h2 {
            font-family: 'Jua', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 24px;
            color: var(--accent);
            text-align: center;
            display: block;
        }

        .result-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: var(--selected-bg);
            border: 2px solid var(--selected-border);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-rank {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .result-num {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 700;
        }

        .result-name {
            font-family: 'Jua', sans-serif;
            font-size: 1.3rem;
            color: var(--text);
        }

        .exclude-hint {
            font-size: 0.9rem;
            color: #7a7a7a;
            margin-bottom: 20px;
            padding: 12px 18px;
            background: #fff8f9;
            border-radius: 15px;
            border: 1px dashed var(--accent2);
            text-align: center;
        }

        @media (max-width: 600px) {
            .student-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .container {
                padding: 20px;
            }
            .btn-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌸 비룡초 청소당번 🌸</h1>
        <p>친구들과 함께하는 즐거운 청소 시간!</p>
    </header>

    <div class="container">

        <div class="controls">
            <label for="pickCount">추첨 인원</label>
            <input type="number" id="pickCount" min="1" max="25" value="5" />
            <span class="hint">* 이름 클릭 시 제외</span>
        </div>

        <p class="exclude-hint">💡 제외할 학생 이름을 클릭하면 추첨에서 빠집니다. 다시 클릭하면 포함됩니다.</p>

        <div class="grid-label">🎈 학생 명단</div>
        <div class="student-grid" id="studentGrid"></div>

        <div class="btn-row">
            <button class="btn btn-primary" id="drawBtn" onclick="draw()">🎲 추첨 시작!</button>
            <button class="btn btn-reset" onclick="reset()">↩ 초기화</button>
        </div>

        <div id="resultSection" style="display:none"></div>

    </div>

    <script>
        const NAMES = [
            '송준규', '송준규', '송준규', '송준규', '송준규',
            '송준규', '송준규', '송준규', '송준규', '송준규',
            '송준규', '송준규', '송준규', '송준규', '송준규',
            '송준규', '송준규', '송준규', '송준규', '송준규',
            '송준규', '송준규', '송준규', '송준규', '송준규'
        ];

        let excluded = new Set();
        let selected = new Set();
        let rolling = false;

        function renderGrid() {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = '';
            NAMES.forEach((name, i) => {
                const card = document.createElement('div');
                card.className = 'student-card' +
                    (excluded.has(i) ? ' excluded' : '') +
                    (selected.has(i) ? ' selected' : '');
                card.id = 'card-' + i;
                card.innerHTML = `<span class="num">${i + 1}번</span><span class="name">${name}</span>`;
                card.onclick = () => toggleExclude(i);
                grid.appendChild(card);
            });
        }

        function toggleExclude(i) {
            if (rolling) return;
            if (selected.has(i)) return;
            if (excluded.has(i)) excluded.delete(i);
            else excluded.add(i);
            renderGrid();
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function draw() {
            if (rolling) return;
            const count = parseInt(document.getElementById('pickCount').value) || 5;
            const pool = NAMES.map((_, i) => i).filter(i => !excluded.has(i));

            if (pool.length < count) {
                alert(`추첨 가능한 학생(${pool.length}명)이 추첨 인원(${count}명)보다 적습니다.`);
                return;
            }

            rolling = true;
            selected.clear();
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('drawBtn').disabled = true;
            renderGrid();

            const ROLL_DURATION = 1800;
            const ROLL_INTERVAL = 80;
            const startTime = Date.now();

            await new Promise(resolve => {
                const interval = setInterval(() => {
                    const sample = shuffle([...pool]).slice(0, count);
                    document.querySelectorAll('.student-card').forEach(c => c.classList.remove('rolling'));
                    sample.forEach(i => {
                        const card = document.getElementById('card-' + i);
                        if (card) card.classList.add('rolling');
                    });
                    if (Date.now() - startTime >= ROLL_DURATION) {
                        clearInterval(interval);
                        document.querySelectorAll('.student-card').forEach(c => c.classList.remove('rolling'));
                        resolve();
                    }
                }, ROLL_INTERVAL);
            });

            const result = shuffle([...pool]).slice(0, count);
            result.forEach(i => selected.add(i));
            renderGrid();
            showResult(result);

            rolling = false;
            document.getElementById('drawBtn').disabled = false;
        }

        function showResult(indices) {
            const section = document.getElementById('resultSection');
            const medals = ['👑', '⭐', '✨', '🎈', '🍭', '🌈', '🍦', '🍩', '🍒', '🍓'];
            section.innerHTML = `
      <div class="result-section">
        <h2>🎉 오늘의 주인공! 🎉</h2>
        <div class="result-list">
          ${indices.map((i, rank) => `
            <div class="result-item">
              <span class="result-rank">${medals[rank] || '🍰'}</span>
              <span class="result-num">${i + 1}번</span>
              <span class="result-name">${NAMES[i]}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
            section.style.display = 'block';
        }

        function reset() {
            if (rolling) return;
            excluded.clear();
            selected.clear();
            document.getElementById('resultSection').style.display = 'none';
            renderGrid();
        }

        renderGrid();
    </script>
</body>

</html>
